<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title description">
  <title id="title">Berlin apartment: simplified layout guide</title>
  <desc id="description">Guide redrawn from the supplied 1998 plan, not to scale. Living room 32.90 square metres, bedroom 18.32, kitchen 8.04, bathroom 3.91, guest WC 2.36, entrance hall 2.71 and utility room 1.98. An L-shaped terrace of 53.80 square metres wraps around two sides.</desc>
